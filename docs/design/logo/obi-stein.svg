<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">NeonDojo – Spielstein mit Gürtel</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16302f"/>
      <stop offset="1" stop-color="#091013"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <!-- Checker seen from above -->
  <g filter="url(#glow)">
    <circle cx="128" cy="122" r="80" fill="#0f2226" stroke="#3df2e0" stroke-width="11"/>
    <circle cx="128" cy="122" r="52" fill="none" stroke="#3df2e0" stroke-width="5" opacity=".75"/>
  </g>
  <!-- Belt with knot and tails -->
  <g filter="url(#glow)" fill="#ff4fa3">
    <path d="M34 128 L222 98 L226 122 L38 152 Z"/>
    <path d="M114 138 L132 136 L108 214 L88 206 Z"/>
    <path d="M128 134 L146 132 L174 206 L154 214 Z"/>
    <rect x="108" y="104" width="40" height="38" rx="9" transform="rotate(-9 128 123)" fill="#ff7cbc"/>
  </g>
</svg>
