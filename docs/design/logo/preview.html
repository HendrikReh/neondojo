<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>NeonDojo Logo-Entwürfe</title>
<style>
  body { margin: 0; padding: 32px; background: #0b1114; color: #e8f4f2;
         font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 24px; }
  section { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: center;
            padding: 24px 0; border-top: 1px solid #24343a; }
  h2 { font-size: 14px; font-weight: 600; margin: 8px 0 0; }
  p { font-size: 12px; color: #a9bcc0; margin: 4px 0 0; }
  .row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .lockup { display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-radius: 14px; }
  .lockup.dark { background: #15191f; }
  .lockup.light { background: #eef1f5; color: #202833; }
  .word { font-size: 34px; font-weight: 700; letter-spacing: -1px; }
  .word b { color: #3df2e0; font-weight: 700; text-shadow: 0 0 10px rgba(61,242,224,.55); }
  .light .word b { color: #0f9c8f; text-shadow: none; }
  .header { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600;
            letter-spacing: -1px; background: #1e242d; padding: 8px 14px; border-radius: 8px; }
</style>
</head>
<body>
<h1>NeonDojo – Logo-Entwürfe</h1>
<template id="t">
  <section>
    <div><img width="200" height="200"><h2></h2><p></p></div>
    <div class="row">
      <div class="lockup dark"><img width="56" height="56"><span class="word"><b>Neon</b>Dojo</span></div>
      <div class="lockup light"><img width="56" height="56"><span class="word"><b>Neon</b>Dojo</span></div>
      <div class="header"><img width="30" height="30">NeonDojo</div>
      <img width="32" height="32"><img width="16" height="16">
    </div>
  </section>
</template>
<script>
  const concepts = [
    ['torii-sonne.svg', 'A · Torii-Sonne', 'Torii als Dojo-Tor; die Pfeiler sind Backgammon-Zungen, die Sonne ist ein Spielstein.'],
    ['enso-points.svg', 'B · Ensō', 'Zen-Pinselkreis mit zwei gegenläufigen Zungen – beide Brettseiten.'],
    ['obi-stein.svg', 'C · Obi-Stein', 'Spielstein mit Kampfsport-Gürtel – Training und Fortschritt.'],
  ];
  const t = document.getElementById('t');
  for (const [file, name, text] of concepts) {
    const node = t.content.cloneNode(true);
    node.querySelectorAll('img').forEach((img) => { img.src = file; img.alt = name; });
    node.querySelector('h2').textContent = name;
    node.querySelector('p').textContent = text;
    document.body.append(node);
  }
</script>
</body>
</html>
