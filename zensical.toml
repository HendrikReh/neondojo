[project]
site_name = "NeonDojo"
site_description = "User guide, feature reference, and development documentation for NeonDojo."
site_url = "https://hendrikreh.github.io/neondojo/"
repo_url = "https://github.com/HendrikReh/neondojo"
edit_uri = "edit/main/docs/"
site_dir = "target/docs-site"
exclude_docs = """
/superpowers/
/research/
/reviews/
/design/logo/
"""
nav = [
  { "NeonDojo manual" = "index.md" },
  { "NeonGammon manual" = "https://hendrikreh.github.io/neongammon/" },
  { "User guide" = "user-guide/README.md" },
  { "Feature reference" = [
    { "Playing" = "reference/playing.md" },
    { "Analysis" = "reference/analysis.md" },
    { "Match library, positions and players" = "reference/library.md" },
    { "Study" = "reference/study.md" },
    { "Settings and profiles" = "reference/settings.md" },
    { "Extras" = "reference/extras.md" },
    { "HedgeHog comparison" = "reference/hedgehog-comparison.md" },
  ] },
  { "Development" = [
    { "Architecture" = "development/architecture.md" },
    { "API reference" = "development/api.md" },
    { "Verification and tests" = "development/testing.md" },
    { "Local NeonGammon setup" = "open-sage-local.md" },
    { "Import corpus results" = "import-corpus-results.md" },
    { "Engine duel CPU budget" = "engine-duel-cpu-budget.md" },
    { "UI navigation" = "ui-navigation.md" },
    { "Typography" = "typography.md" },
    { "Action icons" = "design/action-icons-proposal.md" },
  ] },
]

[project.theme]
variant = "classic"
custom_dir = "docs-theme"
font = false
logo = "assets/neondojo-logo.svg"
favicon = "assets/neondojo-logo.svg"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "pink"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "pink"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.validation.links]
anchors = "warn"
unrecognized_links = "warn"

[project.markdown_extensions.tables]
# Match the published GitHub-style heading IDs, including consecutive hyphens.
[project.markdown_extensions.toc.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"
