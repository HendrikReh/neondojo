name: neondojo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neondojo
      POSTGRES_PASSWORD: neondojo_local
      POSTGRES_DB: neondojo
    ports:
      - "127.0.0.1:${NEONDOJO_DB_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondojo -d neondojo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
