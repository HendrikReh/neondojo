name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-theme/**'
      - 'zensical.toml'
      - 'tools/check_docs_site.py'
      - 'web/public/neondojo-logo.svg'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install zensical==0.1.4
      - run: zensical build --clean --strict
      - run: python tools/check_docs_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
