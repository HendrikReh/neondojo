name: CI

# Covers the default test tier: everything that needs at most PostgreSQL.
# GNUbg, NeonGammon, import corpora, the BGBlitz theme archives, and the
# Playwright suite are not available here; run them locally
# (docs/development/testing.md#verification).
#
# Pull requests and pushes to main do not trigger a run; main is checked once a
# night. Run the checks locally before merging, or start a run by hand:
# gh workflow run ci.yml --ref <branch>

on:
  schedule:
    # Runs on the default branch (main). UTC, off the full hour to avoid delays.
    - cron: '17 2 * * *'
  push:
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neondojo
          POSTGRES_PASSWORD: neondojo_local
          POSTGRES_DB: neondojo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neondojo -d neondojo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Maintenance database: each #[sqlx::test] creates its own database.
      DATABASE_URL: postgres://neondojo:neondojo_local@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain used locally so new Clippy lints arrive with a
      # deliberate toolchain update, not with an unrelated push.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # The BGBlitz archives are not in the repository; preparation drops their
      # themes for this run only.
      NEONDOJO_ALLOW_MISSING_THEMES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck:e2e
      - run: npm run test:themes
      - run: npm run build
