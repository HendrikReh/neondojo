[package]
name = "neondojo-board"
version = "1.4.2"
edition = "2024"

[dependencies]
anyhow = "1"
gpui-kit = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
neondojo-rules = { path = "../neondojo-rules" }
quick-xml = "0.41"
resvg = "0.46"
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
gpui-kit = { version = "0.11", features = ["test-support"] }
tempfile = "3"
