[package]
name = "neondojo-desktop"
version = "1.5.1"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
gpui-kit = "0.11"
neondojo = { path = "../../backend" }
neondojo-board = { path = "../neondojo-board" }
neondojo-i18n = { path = "../neondojo-i18n" }
neondojo-rules = { path = "../neondojo-rules" }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKURLSchemeHandler", "WKURLSchemeTask", "objc2-app-kit"] }

[dev-dependencies]
gpui-kit = { version = "0.11", features = ["test-support"] }
tempfile = "3"
