[workspace]
members = [
    "backend",
    "crates/neondojo-rules",
    "crates/neondojo-i18n",
    "crates/neondojo-board",
    "crates/neondojo-desktop",
]
default-members = ["backend", "crates/neondojo-rules", "crates/neondojo-i18n"]
resolver = "2"

# Explicitly disable even Cargo's implicit debuginfo stripping. Older Rust/LLVM
# can produce dylibs that macOS 27 refuses to load (including procedural macros).
# Keep this at workspace level so direct builds, tests and local restarts agree.
# https://github.com/rust-lang/rust/issues/157750
[profile.dev]
strip = "none"

[profile.dev.build-override]
strip = "none"

[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"
